<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Local RAG AI Assistant — ask questions about your documents, fully offline using Foundry Local and Phi-3.5 Mini." />
  <title>Local RAG AI Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    /* ── Reset & Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-base:       #0d1117;
      --bg-surface:    #161b22;
      --bg-elevated:   #1c2128;
      --bg-border:     #21262d;
      --bg-hover:      #262c36;
      --accent:        #58a6ff;
      --accent-dim:    rgba(88,166,255,0.15);
      --accent-glow:   rgba(88,166,255,0.08);
      --green:         #3fb950;
      --green-dim:     rgba(63,185,80,0.18);
      --amber:         #d29922;
      --amber-dim:     rgba(210,153,34,0.15);
      --red:           #f85149;
      --purple:        #bc8cff;
      --purple-dim:    rgba(188,140,255,0.15);
      --text-primary:  #e6edf3;
      --text-secondary:#8b949e;
      --text-muted:    #484f58;
      --radius-sm:     6px;
      --radius-md:     10px;
      --radius-lg:     14px;
      --radius-xl:     20px;
      --shadow-sm:     0 1px 4px rgba(0,0,0,0.3);
      --shadow-md:     0 4px 16px rgba(0,0,0,0.4);
      --shadow-lg:     0 8px 32px rgba(0,0,0,0.5);
      --font-mono:     'JetBrains Mono', 'Fira Code', monospace;
      --transition:    0.18s ease;
    }

    html, body {
      height: 100%;
      background: var(--bg-base);
      color: var(--text-primary);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 15px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* ── App Shell ── */
    .app-shell {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-width: 900px;
      margin: 0 auto;
    }

    /* ── Header ── */
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      height: 56px;
      border-bottom: 1px solid var(--bg-border);
      background: var(--bg-surface);
      flex-shrink: 0;
      position: relative;
      z-index: 10;
    }

    .header-left { display: flex; align-items: center; gap: 10px; }

    .brand-icon {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, #1f4068, var(--accent));
      border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 0 12px rgba(88,166,255,0.3);
    }

    .brand-icon svg { width: 16px; height: 16px; color: #fff; }

    .brand-name {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.01em;
    }

    .brand-sub {
      font-size: 11px;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }

    .header-right { display: flex; align-items: center; gap: 10px; }

    /* ── Status badge ── */
    .status-badge {
      display: flex; align-items: center; gap: 6px;
      padding: 4px 10px;
      border-radius: 100px;
      font-size: 12px;
      font-weight: 500;
      cursor: default;
      border: 1px solid transparent;
      transition: var(--transition);
    }
    .status-badge.initializing {
      background: var(--amber-dim);
      border-color: rgba(210,153,34,0.3);
      color: var(--amber);
    }
    .status-badge.ready {
      background: var(--green-dim);
      border-color: rgba(63,185,80,0.3);
      color: var(--green);
    }
    .status-badge.error {
      background: rgba(248,81,73,0.15);
      border-color: rgba(248,81,73,0.3);
      color: var(--red);
    }
    .status-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: currentColor;
    }
    .status-badge.initializing .status-dot {
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }

    /* Compact toggle */
    .compact-toggle {
      display: flex; align-items: center; gap: 6px;
      font-size: 12px; color: var(--text-secondary);
      cursor: pointer;
      user-select: none;
    }
    .compact-toggle input { display: none; }
    .toggle-track {
      width: 28px; height: 16px;
      background: var(--bg-border);
      border-radius: 100px;
      position: relative;
      transition: background var(--transition);
    }
    .compact-toggle input:checked + .toggle-track { background: var(--accent); }
    .toggle-thumb {
      position: absolute; top: 2px; left: 2px;
      width: 12px; height: 12px;
      background: #fff;
      border-radius: 50%;
      transition: transform var(--transition);
    }
    .compact-toggle input:checked ~ .toggle-track .toggle-thumb,
    .compact-toggle input:checked + .toggle-track .toggle-thumb { transform: translateX(12px); }

    /* Docs button */
    .btn-docs {
      background: var(--bg-border);
      border: 1px solid var(--bg-hover);
      color: var(--text-secondary);
      border-radius: var(--radius-sm);
      padding: 4px 10px;
      font-size: 12px;
      cursor: pointer;
      transition: var(--transition);
      font-family: inherit;
    }
    .btn-docs:hover { background: var(--bg-hover); color: var(--text-primary); }

    /* ── Progress bar ── */
    .init-progress {
      padding: 0 20px;
      border-bottom: 1px solid var(--bg-border);
      background: var(--bg-surface);
      flex-shrink: 0;
      overflow: hidden;
      max-height: 0;
      transition: max-height 0.35s ease, padding 0.35s ease;
    }
    .init-progress.visible { max-height: 90px; padding: 12px 20px; }

    .progress-label {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 6px;
      display: flex; justify-content: space-between;
    }
    .progress-bar-track {
      height: 4px;
      background: var(--bg-border);
      border-radius: 100px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--purple));
      border-radius: 100px;
      width: 0%;
      transition: width 0.5s ease;
    }
    .progress-bar-fill.indeterminate {
      width: 40% !important;
      animation: slide 1.6s ease-in-out infinite;
    }
    @keyframes slide {
      0% { transform: translateX(-150%); }
      100% { transform: translateX(350%); }
    }

    /* ── Quick Topics ── */
    .topic-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border-bottom: 1px solid var(--bg-border);
      background: var(--bg-surface);
      flex-shrink: 0;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .topic-bar::-webkit-scrollbar { display: none; }

    .topic-chip {
      display: flex; align-items: center; gap: 5px;
      padding: 5px 12px;
      border-radius: 100px;
      border: 1px solid var(--bg-border);
      background: var(--bg-elevated);
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: var(--transition);
      font-family: inherit;
    }
    .topic-chip:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-glow);
      transform: translateY(-1px);
    }
    .topic-chip:active { transform: translateY(0); }

    /* ── Main Chat Area ── */
    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      scroll-behavior: smooth;
      scrollbar-width: thin;
      scrollbar-color: var(--bg-border) transparent;
    }

    /* ── Welcome Panel ── */
    .welcome-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60%;
      text-align: center;
      padding: 40px 20px;
      animation: fadeIn 0.4s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

    .welcome-icon {
      width: 64px; height: 64px;
      background: linear-gradient(135deg, #1f4068, #2d6bcf);
      border-radius: var(--radius-xl);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 0 32px rgba(88,166,255,0.2);
    }
    .welcome-icon svg { width: 30px; height: 30px; color: #fff; }

    .welcome-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }
    .welcome-sub {
      font-size: 14px;
      color: var(--text-secondary);
      max-width: 400px;
      margin-bottom: 28px;
    }

    .welcome-cards {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      max-width: 500px;
      width: 100%;
    }

    .welcome-card {
      background: var(--bg-surface);
      border: 1px solid var(--bg-border);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      text-align: left;
      cursor: pointer;
      transition: var(--transition);
    }
    .welcome-card:hover {
      border-color: var(--accent);
      background: var(--accent-glow);
      transform: translateY(-2px);
      box-shadow: var(--shadow-sm);
    }
    .welcome-card-icon { font-size: 18px; margin-bottom: 6px; }
    .welcome-card-title { font-size: 13px; font-weight: 600; color: var(--text-primary); margin-bottom: 2px; }
    .welcome-card-desc { font-size: 11px; color: var(--text-secondary); }

    /* ── Messages ── */
    .message {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      animation: msgIn 0.25s ease;
    }
    @keyframes msgIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    .message.user { flex-direction: row-reverse; }

    .msg-avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
      font-weight: 600;
    }
    .message.user .msg-avatar { background: var(--accent-dim); color: var(--accent); }
    .message.assistant .msg-avatar {
      background: linear-gradient(135deg, #1f4068, var(--accent));
      color: #fff;
      font-size: 13px;
    }

    .msg-body { flex: 1; max-width: calc(100% - 44px); }
    .message.user .msg-body { align-items: flex-end; }

    .msg-bubble {
      padding: 12px 16px;
      border-radius: var(--radius-md);
      line-height: 1.7;
      font-size: 14px;
      word-break: break-word;
    }
    .message.user .msg-bubble {
      background: var(--accent-dim);
      border: 1px solid rgba(88,166,255,0.25);
      color: var(--text-primary);
      border-radius: var(--radius-md) 4px var(--radius-md) var(--radius-md);
      display: inline-block;
      max-width: 80%;
    }
    .message.assistant .msg-bubble {
      background: var(--bg-surface);
      border: 1px solid var(--bg-border);
      border-radius: 4px var(--radius-md) var(--radius-md) var(--radius-md);
    }

    /* Markdown-like formatting in assistant messages */
    .msg-bubble strong { color: var(--text-primary); font-weight: 600; }
    .msg-bubble em { font-style: italic; color: var(--text-secondary); }
    .msg-bubble code {
      font-family: var(--font-mono);
      font-size: 12.5px;
      background: var(--bg-elevated);
      padding: 1px 5px;
      border-radius: 4px;
      color: var(--purple);
    }
    .msg-bubble ul, .msg-bubble ol { padding-left: 20px; margin: 6px 0; }
    .msg-bubble li { margin: 3px 0; }
    .msg-bubble p { margin: 6px 0; }
    .msg-bubble h1,.msg-bubble h2,.msg-bubble h3 {
      color: var(--text-primary);
      font-weight: 600;
      margin: 10px 0 4px;
    }
    .msg-bubble h1 { font-size: 16px; }
    .msg-bubble h2 { font-size: 15px; }
    .msg-bubble h3 { font-size: 14px; }

    /* ── Sources ── */
    .sources-section {
      margin-top: 10px;
    }
    .sources-toggle {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 11.5px;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 3px 0;
      border: none; background: none;
      font-family: inherit;
      transition: color var(--transition);
    }
    .sources-toggle:hover { color: var(--accent); }
    .sources-toggle svg { transition: transform var(--transition); }
    .sources-toggle.open svg { transform: rotate(90deg); }

    .sources-list {
      display: none;
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .sources-list.hidden { display: none !important; }

    .source-chip {
      display: flex; align-items: flex-start; gap: 8px;
      padding: 8px 10px;
      background: var(--bg-elevated);
      border: 1px solid var(--bg-border);
      border-radius: var(--radius-sm);
      font-size: 11.5px;
    }
    .source-score {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--green);
      background: var(--green-dim);
      padding: 1px 5px;
      border-radius: 4px;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .source-info { flex: 1; min-width: 0; }
    .source-title { color: var(--text-primary); font-weight: 500; margin-bottom: 2px; }
    .source-cat { color: var(--purple); font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; }
    .source-snippet { color: var(--text-secondary); margin-top: 3px; display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    /* ── Typing indicator ── */
    .typing-indicator {
      display: flex; align-items: center; gap: 4px;
      padding: 10px 14px;
      background: var(--bg-surface);
      border: 1px solid var(--bg-border);
      border-radius: 4px var(--radius-md) var(--radius-md) var(--radius-md);
      width: fit-content;
    }
    .typing-dot {
      width: 6px; height: 6px;
      background: var(--text-muted);
      border-radius: 50%;
      animation: bounce 1.2s ease-in-out infinite;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-5px); }
    }

    /* ── Input Bar ── */
    .input-bar {
      padding: 12px 20px 16px;
      border-top: 1px solid var(--bg-border);
      background: var(--bg-surface);
      flex-shrink: 0;
    }

    .input-wrapper {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      background: var(--bg-elevated);
      border: 1px solid var(--bg-border);
      border-radius: var(--radius-lg);
      padding: 8px 8px 8px 14px;
      transition: border-color var(--transition), box-shadow var(--transition);
    }
    .input-wrapper:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .chat-input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 14px;
      line-height: 1.5;
      resize: none;
      max-height: 140px;
      min-height: 22px;
    }
    .chat-input::placeholder { color: var(--text-muted); }

    .input-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }

    .upload-btn {
      width: 32px; height: 32px;
      background: none;
      border: 1px solid var(--bg-border);
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: var(--transition);
      font-family: inherit;
    }
    .upload-btn:hover { background: var(--bg-hover); color: var(--text-secondary); border-color: var(--bg-hover); }

    .send-btn {
      height: 32px;
      padding: 0 14px;
      background: var(--accent);
      border: none;
      border-radius: var(--radius-sm);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex; align-items: center; gap: 5px;
      transition: var(--transition);
      font-family: inherit;
      flex-shrink: 0;
    }
    .send-btn:hover { background: #79b8ff; }
    .send-btn:active { transform: scale(0.97); }
    .send-btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
    .send-btn svg { width: 13px; height: 13px; }

    .input-hint {
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 6px;
    }

    /* ── Modal ── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .modal-overlay.visible { opacity: 1; pointer-events: auto; }

    .modal {
      background: var(--bg-surface);
      border: 1px solid var(--bg-border);
      border-radius: var(--radius-lg);
      padding: 24px;
      width: min(480px, calc(100vw - 40px));
      transform: translateY(16px);
      transition: transform 0.2s;
      box-shadow: var(--shadow-lg);
    }
    .modal-overlay.visible .modal { transform: none; }

    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 16px;
    }
    .modal-title { font-size: 16px; font-weight: 600; }

    .modal-close {
      background: none; border: none;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 20px;
      line-height: 1;
      padding: 2px 6px;
      border-radius: var(--radius-sm);
      transition: var(--transition);
    }
    .modal-close:hover { background: var(--bg-border); color: var(--text-primary); }

    .modal-body { font-size: 13px; color: var(--text-secondary); }

    .docs-list { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
    .doc-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 12px;
      background: var(--bg-elevated);
      border: 1px solid var(--bg-border);
      border-radius: var(--radius-sm);
    }
    .doc-item-left { display: flex; flex-direction: column; gap: 2px; }
    .doc-item-title { font-size: 13px; font-weight: 500; color: var(--text-primary); }
    .doc-item-meta { font-size: 11px; color: var(--text-secondary); }
    .doc-item-chunks {
      font-size: 11px; font-family: var(--font-mono);
      color: var(--accent); background: var(--accent-dim);
      padding: 2px 6px; border-radius: 4px;
    }
    .no-docs { color: var(--text-muted); text-align: center; padding: 16px; font-size: 13px; }

    /* Upload area */
    .upload-area {
      margin-top: 16px;
      border: 2px dashed var(--bg-border);
      border-radius: var(--radius-md);
      padding: 20px;
      text-align: center;
      transition: var(--transition);
    }
    .upload-area.drag-over { border-color: var(--accent); background: var(--accent-glow); }
    .upload-area p { font-size: 12px; color: var(--text-secondary); margin-top: 6px; }
    .upload-area label {
      cursor: pointer;
      color: var(--accent);
      font-weight: 500;
      font-size: 13px;
    }
    .upload-area label:hover { text-decoration: underline; }
    #file-input { display: none; }

    .upload-status {
      margin-top: 10px;
      font-size: 12px;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      display: none;
    }
    .upload-status.success {
      display: block;
      background: var(--green-dim);
      color: var(--green);
      border: 1px solid rgba(63,185,80,0.3);
    }
    .upload-status.error {
      display: block;
      background: rgba(248,81,73,0.12);
      color: var(--red);
      border: 1px solid rgba(248,81,73,0.25);
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--bg-border); border-radius: 100px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--bg-hover); }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      .app-header { padding: 0 14px; }
      .brand-sub { display: none; }
      .topic-bar { padding: 8px 14px; }
      .chat-area { padding: 14px; }
      .input-bar { padding: 10px 14px 14px; }
      .welcome-cards { grid-template-columns: 1fr; }
      .compact-toggle span { display: none; }
    }
  </style>
</head>
<body>
<div class="app-shell">

  <!-- ── Header ── -->
  <header class="app-header">
    <div class="header-left">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a10 10 0 0 1 10 10c0 5.52-4.48 10-10 10S2 17.52 2 12 6.48 2 12 2z"/>
          <path d="M12 8v4l3 3"/>
        </svg>
      </div>
      <div>
        <div class="brand-name">Local RAG Assistant</div>
        <div class="brand-sub">phi-3.5-mini · offline</div>
      </div>
    </div>
    <div class="header-right">
      <label class="compact-toggle" title="Edge/Compact mode — shorter prompts">
        <input type="checkbox" id="compact-mode" />
        <div class="toggle-track"><div class="toggle-thumb"></div></div>
        <span>Edge mode</span>
      </label>
      <button class="btn-docs" id="btn-docs" onclick="openDocsModal()">📄 Docs</button>
      <div class="status-badge initializing" id="status-badge">
        <div class="status-dot"></div>
        <span id="status-text">Initializing…</span>
      </div>
    </div>
  </header>

  <!-- ── Init Progress ── -->
  <div class="init-progress" id="init-progress">
    <div class="progress-label">
      <span id="progress-label-text">Starting model…</span>
      <span id="progress-pct"></span>
    </div>
    <div class="progress-bar-track">
      <div class="progress-bar-fill indeterminate" id="progress-fill"></div>
    </div>
  </div>

  <!-- ── Quick Topics ── -->
  <nav class="topic-bar" id="topic-bar">
    <button class="topic-chip" data-q="How do I use the Pomodoro technique to boost productivity?">🍅 Pomodoro</button>
    <button class="topic-chip" data-q="What is deep work and how can I practice it?">🎯 Deep Work</button>
    <button class="topic-chip" data-q="How can I manage stress at work effectively?">🧘 Stress Relief</button>
    <button class="topic-chip" data-q="What breathing exercises help with immediate stress relief?">💨 Breathing</button>
    <button class="topic-chip" data-q="How do I prioritize tasks using the Eisenhower matrix?">📋 Prioritization</button>
    <button class="topic-chip" data-q="How can I improve my sleep quality to reduce stress?">😴 Sleep</button>
    <button class="topic-chip" data-q="What is mindfulness meditation and how do I start?">🌿 Mindfulness</button>
    <button class="topic-chip" data-q="How do I get into a flow state while working?">⚡ Flow State</button>
  </nav>

  <!-- ── Chat Area ── -->
  <main class="chat-area" id="chat-area">

    <!-- Welcome panel -->
    <div class="welcome-panel" id="welcome-panel">
      <div class="welcome-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
      </div>
      <h1 class="welcome-title">Ask me anything</h1>
      <p class="welcome-sub">Running 100% locally on this device using Foundry Local.<br>No internet required.</p>

      <div class="welcome-cards" id="welcome-cards">
        <button class="welcome-card" data-q="How do I use the Pomodoro technique?">
          <div class="welcome-card-icon">🍅</div>
          <div class="welcome-card-title">Pomodoro Technique</div>
          <div class="welcome-card-desc">Time-boxed focus sessions</div>
        </button>
        <button class="welcome-card" data-q="What is deep work and why is it valuable?">
          <div class="welcome-card-icon">🎯</div>
          <div class="welcome-card-title">Deep Work</div>
          <div class="welcome-card-desc">Distraction-free concentration</div>
        </button>
        <button class="welcome-card" data-q="What are the best techniques for managing stress?">
          <div class="welcome-card-icon">🧘</div>
          <div class="welcome-card-title">Stress Management</div>
          <div class="welcome-card-desc">Evidence-based strategies</div>
        </button>
        <button class="welcome-card" data-q="How can I improve my sleep quality?">
          <div class="welcome-card-icon">😴</div>
          <div class="welcome-card-title">Sleep Optimization</div>
          <div class="welcome-card-desc">Sleep hygiene & recovery</div>
        </button>
      </div>
    </div>

  </main>

  <!-- ── Input Bar ── -->
  <footer class="input-bar">
    <div class="input-wrapper">
      <textarea
        id="chat-input"
        class="chat-input"
        placeholder="Ask a question about your documents…"
        rows="1"
        autocomplete="off"
        spellcheck="false"
      ></textarea>
      <div class="input-actions">
        <button class="upload-btn" id="upload-btn" title="Upload document" onclick="openDocsModal()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
        </button>
        <button class="send-btn" id="send-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
          Send
        </button>
      </div>
    </div>
    <div class="input-hint">Ctrl+Enter to send · Foundry Local · offline</div>
  </footer>

</div>

<!-- ── Docs / Upload Modal ── -->
<div class="modal-overlay" id="docs-modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">📄 Knowledge Base</div>
      <button class="modal-close" onclick="closeDocsModal()">×</button>
    </div>
    <div class="modal-body">
      <div id="docs-list" class="docs-list">
        <div class="no-docs">Loading documents…</div>
      </div>

      <div class="upload-area" id="upload-area">
        <label for="file-input">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24" style="display:block;margin:0 auto 8px">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
          Click to upload a markdown file
        </label>
        <input type="file" id="file-input" accept=".md,.txt" />
        <p>Or drag and drop a .md or .txt file here</p>
      </div>
      <div class="upload-status" id="upload-status"></div>
    </div>
  </div>
</div>

<script>
  // ── State ──
  let isReady = false;
  let isStreaming = false;
  let chatHistory = [];
  let currentAssistantMsg = null;
  let currentSourcesEl = null;

  // ── Elements ──
  const chatArea    = document.getElementById('chat-area');
  const welcomePanel = document.getElementById('welcome-panel');
  const chatInput   = document.getElementById('chat-input');
  const sendBtn     = document.getElementById('send-btn');
  const statusBadge = document.getElementById('status-badge');
  const statusText  = document.getElementById('status-text');
  const initProgress = document.getElementById('init-progress');
  const progressFill = document.getElementById('progress-fill');
  const progressLabel = document.getElementById('progress-label-text');
  const progressPct = document.getElementById('progress-pct');
  const compactMode = document.getElementById('compact-mode');

  // ── Textarea auto-resize ──
  chatInput.addEventListener('input', () => {
    chatInput.style.height = 'auto';
    chatInput.style.height = Math.min(chatInput.scrollHeight, 140) + 'px';
  });

  // ── Send on Ctrl+Enter or Enter (without shift) ──
  chatInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  sendBtn.addEventListener('click', sendMessage);

  // ── Topic chips & welcome cards ──
  document.querySelectorAll('.topic-chip, .welcome-card').forEach(btn => {
    btn.addEventListener('click', () => {
      const q = btn.dataset.q;
      if (q) {
        chatInput.value = q;
        sendMessage();
      }
    });
  });

  // ── Status SSE ──
  function connectStatus() {
    const es = new EventSource('/api/status');
    es.onmessage = (e) => {
      const status = JSON.parse(e.data);
      updateStatus(status);
    };
    es.onerror = () => {
      setTimeout(connectStatus, 3000);
    };
  }

  function updateStatus({ phase, message, progress }) {
    progressLabel.textContent = message;

    if (phase === 'ready') {
      isReady = true;
      sendBtn.disabled = false;
      chatInput.disabled = false;

      statusBadge.className = 'status-badge ready';
      statusText.textContent = 'Ready';
      initProgress.classList.remove('visible');
      progressFill.classList.remove('indeterminate');

    } else if (phase === 'error') {
      statusBadge.className = 'status-badge error';
      statusText.textContent = 'Error';
      initProgress.classList.add('visible');
      progressFill.classList.remove('indeterminate');
      progressFill.style.width = '0%';

    } else {
      statusBadge.className = 'status-badge initializing';
      statusText.textContent = 'Loading…';
      initProgress.classList.add('visible');

      if (progress !== undefined) {
        progressFill.classList.remove('indeterminate');
        progressFill.style.width = (progress * 100) + '%';
        progressPct.textContent = Math.round(progress * 100) + '%';
      } else {
        progressFill.classList.add('indeterminate');
        progressPct.textContent = '';
      }
    }
  }

  // ── Send message ──
  async function sendMessage() {
    const text = chatInput.value.trim();
    if (!text || isStreaming) return;

    // Hide welcome, show chat
    welcomePanel.style.display = 'none';

    // Add user bubble
    appendMessage('user', text);
    chatHistory.push({ role: 'user', content: text });

    chatInput.value = '';
    chatInput.style.height = 'auto';

    isStreaming = true;
    sendBtn.disabled = true;
    chatInput.disabled = true;

    // Show typing indicator
    const typingEl = appendTyping();

    try {
      // Use streaming endpoint
      const res = await fetch('/api/chat/stream', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message: text,
          history: chatHistory.slice(-6),
          compact: compactMode.checked
        })
      });

      typingEl.remove();

      const assistantEl = appendMessage('assistant', '');
      currentAssistantMsg = assistantEl.querySelector('.msg-bubble');

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      let fullAnswer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });

        const lines = buffer.split('\n');
        buffer = lines.pop();

        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const data = line.slice(6).trim();
          if (data === '[DONE]') break;

          try {
            const chunk = JSON.parse(data);
            if (chunk.type === 'sources') {
              renderSources(assistantEl, chunk.sources);
            } else if (chunk.type === 'delta') {
              fullAnswer += chunk.delta;
              currentAssistantMsg.innerHTML = renderMarkdown(fullAnswer);
              scrollToBottom();
            } else if (chunk.type === 'error') {
              currentAssistantMsg.innerHTML = `<span style="color:var(--red)">⚠ Error: ${escapeHtml(chunk.message)}</span>`;
            }
          } catch {}
        }
      }

      if (fullAnswer) {
        chatHistory.push({ role: 'assistant', content: fullAnswer });
      }

    } catch (err) {
      typingEl?.remove();
      appendMessage('assistant', `⚠ Connection error: ${err.message}`);
    }

    isStreaming = false;
    sendBtn.disabled = false;
    chatInput.disabled = false;
    chatInput.focus();
  }

  // ── Append user/assistant message ──
  function appendMessage(role, text) {
    const el = document.createElement('div');
    el.className = `message ${role}`;

    const avatar = document.createElement('div');
    avatar.className = 'msg-avatar';
    avatar.textContent = role === 'user' ? 'U' : '🤖';

    const body = document.createElement('div');
    body.className = 'msg-body';

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.innerHTML = role === 'assistant' ? renderMarkdown(text) : escapeHtml(text);

    body.appendChild(bubble);
    el.appendChild(avatar);
    el.appendChild(body);
    chatArea.appendChild(el);

    scrollToBottom();
    return el;
  }

  // ── Render sources ──
  function renderSources(msgEl, sources) {
    if (!sources || sources.length === 0) return;

    const body = msgEl.querySelector('.msg-body');
    const section = document.createElement('div');
    section.className = 'sources-section';

    const toggle = document.createElement('button');
    toggle.className = 'sources-toggle';
    toggle.innerHTML = `
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12"><polyline points="9 18 15 12 9 6"/></svg>
      ${sources.length} source${sources.length > 1 ? 's' : ''}
    `;

    const list = document.createElement('div');
    list.className = 'sources-list hidden';

    for (const s of sources) {
      const chip = document.createElement('div');
      chip.className = 'source-chip';
      chip.innerHTML = `
        <div class="source-score">${(s.score * 100).toFixed(0)}%</div>
        <div class="source-info">
          <div class="source-title">${escapeHtml(s.title || s.doc_id)}</div>
          ${s.category ? `<div class="source-cat">${escapeHtml(s.category)}</div>` : ''}
          <div class="source-snippet">${escapeHtml(s.snippet || '')}</div>
        </div>
      `;
      list.appendChild(chip);
    }

    toggle.addEventListener('click', () => {
      list.classList.toggle('hidden');
      toggle.classList.toggle('open');
    });

    section.appendChild(toggle);
    section.appendChild(list);
    body.appendChild(section);
  }

  // ── Typing indicator ──
  function appendTyping() {
    const el = document.createElement('div');
    el.className = 'message assistant';
    el.innerHTML = `
      <div class="msg-avatar">🤖</div>
      <div class="msg-body">
        <div class="typing-indicator">
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
        </div>
      </div>
    `;
    chatArea.appendChild(el);
    scrollToBottom();
    return el;
  }

  // ── Helpers ──
  function scrollToBottom() {
    chatArea.scrollTo({ top: chatArea.scrollHeight, behavior: 'smooth' });
  }

  function escapeHtml(text) {
    return String(text)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function renderMarkdown(text) {
    return escapeHtml(text)
      // headings
      .replace(/^### (.+)$/gm, '<h3>$1</h3>')
      .replace(/^## (.+)$/gm, '<h2>$1</h2>')
      .replace(/^# (.+)$/gm, '<h1>$1</h1>')
      // bold / italic
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.+?)\*/g, '<em>$1</em>')
      // inline code
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      // bullet lists
      .replace(/^[•\-\*] (.+)$/gm, '<li>$1</li>')
      .replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>')
      // numbered lists
      .replace(/^\d+\. (.+)$/gm, '<li>$1</li>')
      // paragraphs
      .replace(/\n{2,}/g, '</p><p>')
      .replace(/\n/g, '<br>')
      .replace(/^(?!<[hul])(.+)/, '<p>$1</p>');
  }

  // ── Docs Modal ──
  function openDocsModal() {
    document.getElementById('docs-modal').classList.add('visible');
    loadDocs();
  }

  function closeDocsModal() {
    document.getElementById('docs-modal').classList.remove('visible');
  }

  document.getElementById('docs-modal').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) closeDocsModal();
  });

  async function loadDocs() {
    const listEl = document.getElementById('docs-list');
    listEl.innerHTML = '<div class="no-docs">Loading…</div>';
    try {
      const res = await fetch('/api/docs');
      const docs = await res.json();
      if (!docs.length) {
        listEl.innerHTML = '<div class="no-docs">No documents ingested yet.<br>Run <code>npm run ingest</code> first.</div>';
        return;
      }
      listEl.innerHTML = '';
      for (const doc of docs) {
        const item = document.createElement('div');
        item.className = 'doc-item';
        item.innerHTML = `
          <div class="doc-item-left">
            <div class="doc-item-title">${escapeHtml(doc.title || doc.doc_id)}</div>
            <div class="doc-item-meta">${escapeHtml(doc.doc_id)}${doc.category ? ' · ' + escapeHtml(doc.category) : ''}</div>
          </div>
          <div class="doc-item-chunks">${doc.chunks} chunks</div>
        `;
        listEl.appendChild(item);
      }
    } catch (err) {
      listEl.innerHTML = `<div class="no-docs" style="color:var(--red)">Failed to load docs: ${err.message}</div>`;
    }
  }

  // ── File upload ──
  const fileInput = document.getElementById('file-input');
  const uploadArea = document.getElementById('upload-area');
  const uploadStatus = document.getElementById('upload-status');

  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) uploadFile(file);
  });

  uploadArea.addEventListener('dragover', (e) => {
    e.preventDefault();
    uploadArea.classList.add('drag-over');
  });
  uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('drag-over'));
  uploadArea.addEventListener('drop', (e) => {
    e.preventDefault();
    uploadArea.classList.remove('drag-over');
    const file = e.dataTransfer.files[0];
    if (file) uploadFile(file);
  });

  async function uploadFile(file) {
    uploadStatus.className = 'upload-status';
    uploadStatus.textContent = `Uploading ${file.name}…`;
    uploadStatus.style.display = 'block';

    try {
      const text = await file.text();
      const res = await fetch('/api/upload', {
        method: 'POST',
        headers: { 'Content-Type': 'text/markdown' },
        body: text
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || res.statusText);
      uploadStatus.className = 'upload-status success';
      uploadStatus.textContent = `✓ Uploaded "${data.title}" — ${data.chunks} chunks added`;
      loadDocs();
    } catch (err) {
      uploadStatus.className = 'upload-status error';
      uploadStatus.textContent = `✗ Upload failed: ${err.message}`;
    }
  }

  // ── Init ──
  sendBtn.disabled = true;
  chatInput.disabled = true;
  connectStatus();
</script>
</body>
</html>
